[tool.bumper]
current_version = "0.9.3"
versioning_type = "semver"

[[tool.bumper.files]]
file = "./pyproject.toml"
search = 'version = "{current_version}"'

[[tool.bumper.files]]
file = "./README.md"
search = "pyflysight/{current_version}"

[[tool.bumper.files]]
file = "./pyflysight/__init__.py"
search = '__version__ = "{current_version}"'
